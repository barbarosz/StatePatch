[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statepatch"
version = "0.1.0"
description = "Causal analysis of persistent world-state representations in autoregressive video models"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
